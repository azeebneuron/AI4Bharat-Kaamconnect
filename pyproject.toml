[project]
name = "kaamconnect"
version = "0.1.0"
description = "WhatsApp-based, voice-first job matching platform for India's blue-collar workers"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "moto[dynamodb,s3,sns]>=5.0",
    "ruff>=0.8.0",
    "mypy>=1.13",
    "boto3-stubs[dynamodb,s3,sns,transcribe,bedrock-runtime,lambda]>=1.35",
]
cdk = [
    "aws-cdk-lib>=2.170.0",
    "constructs>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: marks tests as integration tests",
    "property: marks tests as property-based tests",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
